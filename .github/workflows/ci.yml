name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itemdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d itemdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/itemdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r source-code/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run automated test
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t uas-item-api:latest .
